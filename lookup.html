<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>성경필사 신청 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --navy: #1a3a6b;
  --gold: #c8a84b;
  --cream: #fdf8f0;
  --white: #ffffff;
  --gray: #6b7280;
  --light: #f3f0ea;
  --border: #ddd6c8;
  --error: #c0392b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--cream); color: #222; min-height: 100vh; }
header { background: var(--navy); padding: 24px 20px 20px; text-align: center; }
header .label { font-family: 'Nanum Myeongjo', serif; color: var(--gold); font-size: 11px; letter-spacing: 3px; margin-bottom: 8px; }
header h1 { font-family: 'Nanum Myeongjo', serif; color: var(--white); font-size: 22px; font-weight: 800; }
header p { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 8px; font-weight: 300; }
nav { display: flex; background: var(--white); border-bottom: 1px solid var(--border); }
nav a { flex: 1; text-align: center; padding: 14px 0; font-size: 13px; font-weight: 500; color: var(--gray); text-decoration: none; border-bottom: 3px solid transparent; transition: all 0.2s; }
nav a.active { color: var(--navy); border-bottom-color: var(--gold); font-weight: 700; }
main { max-width: 520px; margin: 0 auto; padding: 24px 16px 60px; }
.card { background: var(--white); border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(26,58,107,0.08); margin-bottom: 16px; }
.card-title { font-family: 'Nanum Myeongjo', serif; font-size: 14px; color: var(--navy); font-weight: 700; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.card-title::before { content: ''; display: inline-block; width: 4px; height: 14px; background: var(--gold); border-radius: 2px; }
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
label { display: block; font-size: 12px; font-weight: 500; color: var(--navy); margin-bottom: 6px; }
.chip-group { display: flex; gap: 7px; flex-wrap: wrap; }
.chip-group input[type="radio"] { display: none; }
.chip-group .chip-label { cursor: pointer; }
.chip-group .chip { display: inline-block; padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 20px; font-size: 13px; color: var(--gray); background: var(--cream); transition: all 0.15s; white-space: nowrap; }
.chip-group input[type="radio"]:checked + .chip { border-color: var(--navy); background: var(--navy); color: var(--white); font-weight: 600; }
input[type="text"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; color: #222; background: var(--cream); transition: border-color 0.2s; }
input[type="text"]:focus { outline: none; border-color: var(--navy); background: var(--white); }
.hint { font-size: 11px; color: var(--gray); margin-top: 5px; }
.btn-search { width: 100%; padding: 14px; background: var(--navy); color: var(--white); border: none; border-radius: 10px; font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; letter-spacing: 1px; transition: background 0.2s; }
.btn-search:disabled { background: var(--gray); cursor: not-allowed; }
.btn-stats { display: none; width: 100%; padding: 12px; background: transparent; color: var(--navy); border: 1.5px solid var(--navy); border-radius: 10px; font-size: 13px; font-weight: 500; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
.btn-stats:hover { background: var(--navy); color: var(--white); }
.loading { display: none; text-align: center; padding: 12px; color: var(--gray); font-size: 13px; }
.loading.show { display: block; }
.msg { display: none; padding: 14px 16px; border-radius: 10px; font-size: 13px; line-height: 1.6; margin-top: 14px; text-align: center; }
.msg.error { display: block; background: #fdedec; border: 1px solid #f5b7b1; color: var(--error); }
.msg.warn { display: block; background: #fffbea; border: 1px solid #f0d060; color: #7a5800; }

/* ── 결과 영역 ── */
#results { display: none; }
.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.result-count { font-size: 13px; color: var(--gray); }
.result-count strong { color: var(--navy); font-size: 16px; }

/* ── 결과 카드 ── */
.person-card {
  background: var(--white);
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 2px 10px rgba(26,58,107,0.09);
  overflow: hidden;
  border: 1px solid var(--border);
}

/* 네이비 타이틀 바 */
.person-card-header {
  background: var(--navy);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.person-card-label {
  font-size: 10px;
  font-weight: 600;
  color: rgba(255,255,255,0.55);
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* 이름 섹션 — 타이틀과 분리된 흰 배경 영역 */
.person-card-name-row {
  background: var(--white);
  padding: 12px 16px 11px;
  border-bottom: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.person-card-name {
  font-family: 'Nanum Myeongjo', serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--navy);
}

/* 상태 배지 */
.status-badge { font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 20px; letter-spacing: 0.3px; }
.status-badge.pending    { background: #fff8e1; color: #7a5800; border: 1px solid #f0d060; }
.status-badge.inprogress { background: #e3f2fd; color: #0a4d8c; border: 1px solid #90c4f0; }
.status-badge.other      { background: var(--light); color: var(--gray); border: 1px solid var(--border); }

/* 테이블 — 배경색 없이 라인만 */
.info-table { width: 100%; border-collapse: collapse; }
.info-table tr:last-child td { border-bottom: none; }
.info-table td {
  padding: 10px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  background: var(--white);
}
.info-table td.key {
  font-size: 12px;
  font-weight: 600;
  color: var(--gray);
  width: 76px;
  white-space: nowrap;
  border-right: 1px solid var(--border);
}
.info-table td.val {
  color: #1a2a40;
  font-weight: 400;
  line-height: 1.5;
}

/* ── 통계 카드 ── */
#statsArea { display: none; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.stat-item { background: var(--light); border-radius: 8px; padding: 12px; text-align: center; }
.stat-label { font-size: 11px; color: var(--gray); margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--navy); font-family: 'Nanum Myeongjo', serif; }
.bar-list { margin-top: 8px; }
.bar-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar-label { font-size: 12px; color: #333; min-width: 70px; }
.bar-track { flex: 1; height: 8px; background: var(--light); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--navy); border-radius: 4px; transition: width 0.6s ease; }
.bar-count { font-size: 12px; color: var(--gray); min-width: 24px; text-align: right; }
.no-result { text-align: center; padding: 32px 0; color: var(--gray); font-size: 14px; }
.no-result .icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>
<header>
  <div class="label">고척교회 · 성경필사 프로그램</div>
  <h1>신청 조회</h1>
  <p>신청 현황을 확인하세요</p>
</header>
<nav>
  <a href="index.html">✏️ 신청하기</a>
  <a href="lookup.html" class="active">🔍 신청 조회</a>
</nav>
<main>
  <div class="card">
    <div class="card-title">조회 조건</div>
    <p style="font-size:12px;color:var(--gray);margin-bottom:14px;">교구·목장·성명을 <strong>모두</strong> 입력해야 조회됩니다. (AND 조건, 상태가 완료인 건은 제외됩니다)</p>
    <div class="field">
      <label>교구</label>
      <div class="chip-group">
        <label class="chip-label"><input type="radio" name="district" value="믿음" /><span class="chip">믿음</span></label>
        <label class="chip-label"><input type="radio" name="district" value="소망" /><span class="chip">소망</span></label>
        <label class="chip-label"><input type="radio" name="district" value="사랑" /><span class="chip">사랑</span></label>
        <label class="chip-label"><input type="radio" name="district" value="섬김" /><span class="chip">섬김</span></label>
        <label class="chip-label"><input type="radio" name="district" value="은혜" /><span class="chip">은혜</span></label>
        <label class="chip-label"><input type="radio" name="district" value="화평" /><span class="chip">화평</span></label>
        <label class="chip-label"><input type="radio" name="district" value="기쁨" /><span class="chip">기쁨</span></label>
      </div>
    </div>
    <div class="field">
      <label>목장</label>
      <input type="text" id="s-pasture" placeholder="목장명을 정확히 입력하세요" maxlength="20" />
      <p class="hint">목장명 전체를 정확히 입력해야 조회됩니다.</p>
    </div>
    <div class="field">
      <label>성명</label>
      <input type="text" id="s-name" placeholder="이름을 정확히 입력하세요" maxlength="10" />
      <p class="hint">이름 전체를 정확히 입력해야 조회됩니다.</p>
    </div>
    <button class="btn-search" id="searchBtn" onclick="doSearch()">🔍 조회하기</button>
    <button class="btn-stats" onclick="doStats()" style="display:none">📊 전체 신청 현황 보기</button>
  </div>
  <div class="loading" id="loading">⏳ 조회 중입니다...</div>
  <div class="msg" id="msg"></div>
  <div id="results">
    <div class="result-header">
      <div class="result-count">총 <strong id="resultCount">0</strong>명</div>
    </div>
    <div id="resultList"></div>
  </div>
  <div id="statsArea">
    <div class="card">
      <div class="card-title">전체 신청 현황</div>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-label">총 신청자</div>
          <div class="stat-value" id="st-total">-</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">교구별 신청 현황</div>
      <div class="bar-list" id="st-district"></div>
    </div>
    <div class="card">
      <div class="card-title">성경 선택 현황</div>
      <div class="bar-list" id="st-bible"></div>
    </div>
    <div class="card">
      <div class="card-title">필사 유형 현황</div>
      <div class="bar-list" id="st-type1"></div>
    </div>
  </div>
</main>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycby45DUS0n1aOGZIDE7R02tqywSQNZC8q6oQG0GbpQs7FyAl18hWNxjZKk4G3VXoH9UrDQ/exec';

function getSelectedDistrict() {
  var checked = document.querySelector('input[name="district"]:checked');
  return checked ? checked.value : '';
}

function fmtDate(raw) {
  if (!raw) return '';
  var s = String(raw).trim();
  var d = new Date(s);
  if (isNaN(d.getTime())) {
    var m = s.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\s*(오전|오후)?\s*(\d{1,2}):(\d{2})/);
    if (m) {
      var h = parseInt(m[5], 10);
      if (m[4] === '오후' && h < 12) h += 12;
      if (m[4] === '오전' && h === 12) h = 0;
      d = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10), h, parseInt(m[6],10));
    }
  }
  if (isNaN(d.getTime())) return s;
  var yy = d.getFullYear();
  var mo = String(d.getMonth()+1).padStart(2,'0');
  var dd = String(d.getDate()).padStart(2,'0');
  var hh = String(d.getHours()).padStart(2,'0');
  var mi = String(d.getMinutes()).padStart(2,'0');
  return yy + '-' + mo + '-' + dd + ' ' + hh + ':' + mi;
}

function statusClass(st) {
  if (!st) return 'other';
  if (st === '대기' || st === '접수') return 'pending';
  if (st === '진행중' || st === '처리중') return 'inprogress';
  return 'other';
}

async function doSearch() {
  var district = getSelectedDistrict();
  var pasture  = document.getElementById('s-pasture').value.trim();
  var name     = document.getElementById('s-name').value.trim();
  if (!district && !pasture && !name) {
    showMsg('교구, 목장, 성명 중 하나 이상 선택 또는 입력해 주세요.');
    return;
  }
  setLoading(true);
  hideResults();
  hideMsg();
  try {
    var params = new URLSearchParams({ action: 'lookup' });
    if (district) params.append('교구', district);
    if (pasture)  params.append('목장', pasture);
    if (name)     params.append('성명', name);
    var res  = await fetch(API_URL + '?' + params);
    var data = await res.json();
    if (data.status === 'success') {
      var filtered = (data.data || []).filter(function(person) {
        var pDistrict = String(person['교구'] || '').trim();
        var pPasture  = String(person['목장'] || '').trim();
        var pName     = String(person['성명'] || '').trim();
        var pStatus   = String(person['상태'] || '').trim();
        if (pStatus === '완료') return false;
        if (district && pDistrict !== district) return false;
        if (pasture  && pPasture  !== pasture)  return false;
        if (name     && pName     !== name)     return false;
        return true;
      });
      renderResults(filtered);
    } else {
      showMsg(data.message || '조회 중 오류가 발생했습니다.');
    }
  } catch (err) {
    showMsg('서버와 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
  } finally {
    setLoading(false);
  }
}

async function doStats() {
  setLoading(true);
  hideResults();
  hideMsg();
  document.getElementById('statsArea').style.display = 'none';
  try {
    var res  = await fetch(API_URL + '?action=stats');
    var data = await res.json();
    if (data.status === 'success') {
      renderStats(data);
    } else {
      showMsg(data.message || '통계 조회 중 오류가 발생했습니다.');
    }
  } catch (err) {
    showMsg('서버와 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.');
  } finally {
    setLoading(false);
  }
}

function makeRow(key, val) {
  var tr  = document.createElement('tr');
  var tdK = document.createElement('td');
  tdK.className = 'key';
  tdK.textContent = key;
  var tdV = document.createElement('td');
  tdV.className = 'val';
  tdV.textContent = val || '-';
  tr.appendChild(tdK);
  tr.appendChild(tdV);
  return tr;
}

function renderResults(list) {
  var resultsEl = document.getElementById('results');
  var countEl   = document.getElementById('resultCount');
  var listEl    = document.getElementById('resultList');
  countEl.textContent = list.length;
  listEl.innerHTML = '';
  if (list.length === 0) {
    var noEl   = document.createElement('div');
    noEl.className = 'no-result';
    var iconEl = document.createElement('div');
    iconEl.className = 'icon';
    iconEl.textContent = '📭';
    var msgEl  = document.createElement('div');
    msgEl.textContent = '조회 결과가 없습니다.';
    noEl.appendChild(iconEl);
    noEl.appendChild(msgEl);
    listEl.appendChild(noEl);
  } else {
    list.forEach(function(person) {
      var status = String(person['상태'] || '').trim();
      var card   = document.createElement('div');
      card.className = 'person-card';

      /* 네이비 타이틀 바 (신청자 라벨만) */
      var header = document.createElement('div');
      header.className = 'person-card-header';
      var lbl = document.createElement('span');
      lbl.className = 'person-card-label';
      lbl.textContent = '신청자 정보';
      var badge = document.createElement('span');
      badge.className = 'status-badge ' + statusClass(status);
      badge.textContent = status || '상태없음';
      header.appendChild(lbl);
      header.appendChild(badge);

      /* 이름 섹션 — 흰 배경으로 타이틀과 분리 */
      var nameRow = document.createElement('div');
      nameRow.className = 'person-card-name-row';
      var nameEl = document.createElement('span');
      nameEl.className = 'person-card-name';
      nameEl.textContent = person['성명'] || '(이름 없음)';
      nameRow.appendChild(nameEl);

      /* 테이블 */
      var table = document.createElement('table');
      table.className = 'info-table';
      var tbody = document.createElement('tbody');
      tbody.appendChild(makeRow('교구',    person['교구']));
      tbody.appendChild(makeRow('목장',    person['목장']));
      tbody.appendChild(makeRow('직분',    person['직분']));
      tbody.appendChild(makeRow('성경선택', person['성경선택']));
      tbody.appendChild(makeRow('필사유형', person['선택유형1']));
      tbody.appendChild(makeRow('번역본',  person['선택유형2']));
      tbody.appendChild(makeRow('신청일',  fmtDate(person['타임스탬프'])));
      table.appendChild(tbody);

      card.appendChild(header);
      card.appendChild(nameRow);
      card.appendChild(table);
      listEl.appendChild(card);
    });
  }
  resultsEl.style.display = 'block';
}

function renderStats(data) {
  document.getElementById('st-total').textContent = data.total + '명';
  renderBars('st-district', data.byDistrict, data.total);
  renderBars('st-bible', data.byBible, data.total);
  renderBars('st-type1', data.byType1, data.total);
  document.getElementById('statsArea').style.display = 'block';
}

function renderBars(containerId, obj, total) {
  var el = document.getElementById(containerId);
  el.innerHTML = '';
  if (!obj || Object.keys(obj).length === 0) { el.textContent = '데이터 없음'; return; }
  Object.entries(obj).sort(function(a,b){return b[1]-a[1];}).forEach(function(entry) {
    var pct  = total > 0 ? Math.round(entry[1]/total*100) : 0;
    var item = document.createElement('div'); item.className = 'bar-item';
    var lbl  = document.createElement('div'); lbl.className = 'bar-label'; lbl.textContent = entry[0];
    var track= document.createElement('div'); track.className = 'bar-track';
    var fill = document.createElement('div'); fill.className = 'bar-fill'; fill.style.width='0%'; fill.dataset.w=pct+'%';
    track.appendChild(fill);
    var cnt  = document.createElement('div'); cnt.className = 'bar-count'; cnt.textContent = entry[1];
    item.appendChild(lbl); item.appendChild(track); item.appendChild(cnt);
    el.appendChild(item);
  });
  requestAnimationFrame(function(){ el.querySelectorAll('.bar-fill').forEach(function(b){b.style.width=b.dataset.w;}); });
}

function setLoading(on) {
  document.getElementById('loading').className = 'loading'+(on?' show':'');
  document.getElementById('searchBtn').disabled = on;
}
function hideResults() {
  document.getElementById('results').style.display = 'none';
  document.getElementById('statsArea').style.display = 'none';
}
function showMsg(text) {
  var el = document.getElementById('msg');
  el.className = 'msg error';
  el.textContent = '❌ ' + text;
}
function hideMsg() {
  var el = document.getElementById('msg');
  el.className = 'msg';
  el.textContent = '';
}
['s-pasture','s-name'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });
});
</script>
</body>
</html>
